<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · kova.</title>
  <link rel="stylesheet" href="/css/kova.css">
</head>
<body>
<div id="nav-slot"></div>
<main class="container" style="padding-top:32px;padding-bottom:48px">
  <h2 style="margin-bottom:28px">Carrito</h2>
  <div id="cart-root"></div>
</main>
<script type="module">
import { api, auth } from '/js/modules/api.js';
import { cart } from '/js/modules/cart.js';
import { renderNav, fmtPrice, toast } from '/js/modules/ui.js';
import { t } from '/js/modules/i18n.js';

async function boot() {
  cart.subscribe(render);   // FIX: suscribir ANTES de init para no perder el primer emit
  renderNav(cart);
  await cart.init();
}

function render({ items, total, count }) {
  const root = document.getElementById('cart-root');
  if (!items.length) {
    root.innerHTML = `
      <div class="empty">
        <div class="empty__icon">○</div>
        <div class="empty__title">${t('cart.empty')}</div>
        <a href="/" class="btn btn--secondary" style="margin-top:16px">${t('cart.view')}</a>
      </div>`;
    return;
  }
  root.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start">
      <div class="card card--flush">
        <div class="card__body" id="items-body"></div>
      </div>
      <div>
        <div class="order-summary" id="summary"></div>
      </div>
    </div>`;

  // Items
  document.getElementById('items-body').innerHTML = items.map(item => `
    <div class="cart-row">
      <img class="cart-thumb" src="${item.image_url || 'https://images.unsplash.com/photo-1588168333986-5078d3ae3976?w=150&q=60'}" alt="${item.name}"
        onerror="this.src='https://images.unsplash.com/photo-1588168333986-5078d3ae3976?w=150&q=60'">
      <div>
        <div class="cart-name">${item.name}</div>
        <div class="cart-unit">${fmtPrice(item.price)} × unidad</div>
        <div class="qty">
          <button class="qty__btn" data-action="dec" data-id="${item.item_id||item.product_id}" data-qty="${item.quantity}">−</button>
          <span class="qty__val">${item.quantity}</span>
          <button class="qty__btn" data-action="inc" data-id="${item.item_id||item.product_id}" data-qty="${item.quantity}" data-max="${item.stock}">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-family:var(--f-display);font-weight:700;color:var(--ink)">${fmtPrice(item.price*item.quantity)}</div>
        <button style="background:none;border:none;color:var(--danger);font-size:.8rem;cursor:pointer;margin-top:8px"
          data-action="del" data-id="${item.item_id||item.product_id}">Eliminar</button>
      </div>
    </div>`).join('');

  document.getElementById('items-body').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, id, qty, max } = btn.dataset;
    if (action === 'del') { await cart.remove(id); }
    else if (action === 'dec') { await cart.update(id, +qty - 1); }
    else if (action === 'inc') { await cart.update(id, Math.min(+qty + 1, +max)); }
  });

  // Summary
  const coupon = sessionStorage.getItem('kova_coupon') || '';
  document.getElementById('summary').innerHTML = `
    <div style="font-family:var(--f-display);font-weight:700;font-size:.95rem;margin-bottom:16px">Resumen</div>
    <div class="coupon-row">
      <input id="coupon-in" class="field__input" placeholder="${t('cart.coupon')}" value="${coupon}" style="height:36px">
      <button class="btn btn--ghost btn--sm" id="coupon-btn">${t('cart.apply')}</button>
    </div>
    ${coupon ? `<div class="alert alert--ok" style="margin-bottom:12px">Cupón <strong>${coupon}</strong> listo para aplicar</div>` : ''}
    <div class="summary-row"><span>${count} producto${count!==1?'s':''}</span><span>${fmtPrice(total)}</span></div>
    <div class="summary-row"><span>${t('cart.shipping')}</span><span style="color:var(--ok)">${t('cart.free')}</span></div>
    <div class="summary-row summary-row--total"><span>${t('cart.total')}</span><span>${fmtPrice(total)}</span></div>
    <button class="btn btn--primary btn--full" style="margin-top:16px" id="checkout-btn">${t('cart.checkout')}</button>
    <button class="btn btn--secondary btn--sm btn--full" style="margin-top:8px" id="clear-btn">${t('cart.clear')}</button>`;

  document.getElementById('coupon-btn').addEventListener('click', () => {
    const code = document.getElementById('coupon-in').value.trim().toUpperCase();
    if (code) { sessionStorage.setItem('kova_coupon', code); toast('Cupón guardado', 'ok'); render({ items, total, count }); }
  });
  document.getElementById('checkout-btn').addEventListener('click', () => {
    if (!auth.getToken()) { toast('Inicia sesión para continuar', 'err'); setTimeout(() => location.href='/login.html', 1200); return; }
    location.href = '/checkout.html';
  });
  document.getElementById('clear-btn').addEventListener('click', () => {
    if (confirm('¿Vaciar el carrito?')) cart.clear();
  });
}

boot();
</script>
</body>
</html>
